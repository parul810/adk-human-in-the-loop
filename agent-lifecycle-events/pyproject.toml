[project]
name = "agent-lifecycle-events"
version = "0.1.0"
description = "ADK plugin that publishes agent lifecycle events to webhooks and Kafka"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lifecycle"]
